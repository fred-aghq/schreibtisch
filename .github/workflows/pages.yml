name: Deploy to GitHub Pages

# Production deploys to the root of the gh-pages branch. PR previews live under
# pr-preview/ on the same branch (see preview.yml), so this must not wipe them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for /<repo>/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Serve files as-is; Jekyll would otherwise skip anything starting with "_".
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          # Rebase instead of force-pushing so concurrent preview deploys aren't lost.
          force: false
